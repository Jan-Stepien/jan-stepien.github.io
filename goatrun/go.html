<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>G.O.A.T Run</title>
<style>body{font:18px -apple-system,system-ui,sans-serif;background:#78c8ff;color:#1f2a5c;text-align:center;padding:60px 20px}a{color:#1f2a5c;font-weight:700}</style>
</head>
<body>
<p>Taking you to G.O.A.T Run&hellip;</p>
<p><a id="manual" href="index.html">Tap here if nothing happens</a></p>
<script>
// A smart link for campaigns:  go.html?c=youtube   (c = which channel sent the visitor)
// Android goes to Google Play (with the channel as the install referrer, so Play Console
// shows installs per channel), iPhone to the App Store once it is live, anyone else to the page.
var ANDROID = 'com.goatrun.goat_run';
var IOS_ID = null;          // set to '6819062132' when the App Store version is live
var params = new URLSearchParams(location.search);
var channel = (params.get('c') || 'direct').replace(/[^a-z0-9_-]/gi, '');
var campaign = (params.get('camp') || 'launch').replace(/[^a-z0-9_-]/gi, '');
var ua = navigator.userAgent || '';
var target = 'index.html?utm_source=' + channel;
if (/android/i.test(ua) || params.get('to') === 'android') {
  var ref = encodeURIComponent('utm_source=' + channel + '&utm_medium=social&utm_campaign=' + campaign);
  target = 'https://play.google.com/store/apps/details?id=' + ANDROID + '&referrer=' + ref;
} else if ((/iPhone|iPad|iPod/i.test(ua) || params.get('to') === 'ios') && IOS_ID) {
  target = 'https://apps.apple.com/app/id' + IOS_ID + '?ct=' + channel + '&pt=0&mt=8';
}
document.getElementById('manual').href = target;
location.replace(target);
</script>
</body>
</html>
